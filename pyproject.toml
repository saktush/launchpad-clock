[project]
name = "launchpad-clock"
version = "0.1.0"
description = "Clock on a Novation Launchpad Mini (mk1/mk2) 8x8 grid"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["mido>=1.3", "python-rtmidi>=1.5"]

[project.scripts]
launchpad-clock = "launchpad_clock.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["launchpad_clock"]
